const mathHTML=function mathHTML(text){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const SYM = {angle:'∠',triangle:'△',perp:'⊥',parallel:'∥',cdot:'·',times:'×',div:'÷',
    le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',approx:'≈',pm:'±',mp:'∓',ast:'*',
    circ:'°',degree:'°',because:'∵',therefore:'∴',Rightarrow:'⇒',Leftarrow:'⇐',
    rightarrow:'→',leftarrow:'←',leftrightarrow:'↔',infty:'∞',sum:'Σ',Delta:'Δ',
    alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',lambda:'λ',mu:'μ',pi:'π',
    sigma:'σ',omega:'ω',Omega:'Ω',varphi:'φ',phi:'φ',varepsilon:'ε',epsilon:'ε',
    prime:'′',ldots:'…',cdots:'⋯',sim:'∽',cong:'≌',anglemark:'∠'};
  function group(s,i){
    let d=0;
    for(let j=i;j<s.length;j++){
      if(s[j]==='\\'){ j++; continue; }
      if(s[j]==='{') d++;
      else if(s[j]==='}'){ d--; if(!d) return [s.slice(i+1,j), j+1]; }
    }
    return [s.slice(i+1), s.length];
  }
  function tex(s){
    let out='', i=0;
    while(i<s.length){
      const c=s[i];
      if(c==='\\'){
        const m=/^\\([A-Za-z]+)/.exec(s.slice(i));
        if(!m){ out+=esc(s[i+1]||''); i+=2; continue; }
        const name=m[1]; let j=i+m[0].length;
        if(name==='frac'||name==='dfrac'||name==='tfrac'||name==='cfrac'){
          let a='',b='';
          if(s[j]==='{'){ const g=group(s,j); a=tex(g[0]); j=g[1]; }
          if(s[j]==='{'){ const g=group(s,j); b=tex(g[0]); j=g[1]; }
          out+='<span class="mfrac"><span class="mnum">'+a+'</span><span class="mden">'+b+'</span></span>';
          i=j; continue;
        }
        if(name==='sqrt'){
          let idx='', body='';
          if(s[j]==='['){ const k=s.indexOf(']',j); if(k>j){ idx=tex(s.slice(j+1,k)); j=k+1; } }
          if(s[j]==='{'){ const g=group(s,j); body=tex(g[0]); j=g[1]; }
          out+='<span class="msqrt">'+(idx?'<sup class="midx">'+idx+'</sup>':'')+
               '<span class="mrad">√</span><span class="mbody">'+body+'</span></span>';
          i=j; continue;
        }
        if(name==='overline'||name==='vec'||name==='overrightarrow'){
          if(s[j]==='{'){ const g=group(s,j); const body=tex(g[0]); j=g[1];
            out+= name==='overline' ? '<span class="mover">'+body+'</span>'
                                    : '<span class="mvec">'+body+'</span>';
          }
          i=j; continue;
        }
        if(Object.prototype.hasOwnProperty.call(SYM,name)){ out+=esc(SYM[name]); i=j; continue; }
        out+=esc(m[0]); i=j; continue;
      }
      if(c==='^'||c==='_'){
        let j=i+1, body='';
        if(s[j]==='{'){ const g=group(s,j); body=tex(g[0]); j=g[1]; }
        else if(s[j]==='\\'){
          const mm=/^\\([A-Za-z]+)/.exec(s.slice(j));
          if(mm){ body=tex(s.slice(j,j+mm[0].length)); j+=mm[0].length; }
          else { body=tex(s[j]||''); j+=1; }
        }
        else { body=tex(s[j]||''); j+=1; }
        out += (c==='^' && body==='°') ? '°' : (c==='^' ? '<sup>'+body+'</sup>' : '<sub>'+body+'</sub>');
        i=j; continue;
      }
      if(c==='{'){ const g=group(s,i); out+=tex(g[0]); i=g[1]; continue; }
      out+=esc(c); i++;
    }
    return out;
  }
  function inline(str){
    return str.split(/\*\*([^*]+)\*\*/g).map(function(p,k){ return k%2 ? '<b>'+p+'</b>' : p; }).join('');
  }
  let out='', i=0;
  while(i<text.length){
    const s = text.indexOf('$', i);
    if(s<0){ out+=inline(esc(text.slice(i)).replace(/\n/g,'<br>')); break; }
    if(text.indexOf('$$', s)===s){
      const e = text.indexOf('$$', s+2);
      if(e<0){ out+=inline(esc(text.slice(i)).replace(/\n/g,'<br>')); break; }
      out+=inline(esc(text.slice(i,s)).replace(/\n/g,'<br>'));
      out+='<span class="m" style="display:block;text-align:center;margin:.35em 0">'+tex(text.slice(s+2,e))+'</span>';
      i=e+2; continue;
    }
    const e = text.indexOf('$', s+1);
    if(e<0){ out+=inline(esc(text.slice(i)).replace(/\n/g,'<br>')); break; }
    out+=inline(esc(text.slice(i,s)).replace(/\n/g,'<br>'));
    out+='<span class="m">'+tex(text.slice(s+1,e))+'</span>';
    i=e+1;
  }
  return out;
};
let i=0;const im=document.getElementById('im'),nt=document.getElementById('nt'),pg=document.getElementById('pg');
function go(d){i=Math.max(0,Math.min(IMGS.length-1,i+d));render();}
function render(){im.src=IMGS[i];nt.innerHTML=NOTES[i]?mathHTML(NOTES[i]):'';nt.style.display=NOTES[i]?'block':'none';
pg.textContent=(i+1)+' / '+IMGS.length;}
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}});
